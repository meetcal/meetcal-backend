display:
  error: true
  new: true
  unchanged: false
  empty-diff: false

report:
  # One Sentry event per changed or failing page; see sentry_hooks.py.
  sentry:
    enabled: true
  stdout:
    enabled: true
    color: false
  text:
    details: true
    footer: true
    line_length: 75

job_defaults:
  all: {}
  shell: {}
  url: {}
  browser: {}
