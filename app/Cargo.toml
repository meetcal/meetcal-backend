[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
config = "0.15.23"
dotenvy = "0.15.7"
tower-http = { version = "0.6", features = [
  "compression-gzip",
  "compression-br",
] }
regex = "1.12.3"
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = [
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
]

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
