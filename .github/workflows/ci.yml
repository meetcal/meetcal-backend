name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetcal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetcal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_DATABASE__HOST: 127.0.0.1
      APP_DATABASE__PORT: 5432
      APP_DATABASE__USERNAME: postgres
      APP_DATABASE__PASSWORD: postgres
      APP_DATABASE__DATABASE_NAME: meetcal
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/meetcal
      MEETCAL_ALLOW_TEST_DB_RESET: "1"
      SKIP_DOCKER: "1"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Prepare test database
        run: scripts/setup_test_db.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Validate operational scripts
        working-directory: ${{ github.workspace }}
        run: shellcheck -x -P app/scripts app/deploy/*.sh app/scripts/*.sh

      - name: Build production container
        run: docker build .

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile scraper sources
        run: python -m compileall -q usaw usamw bwl

      - name: Meet automation unit tests
        run: PYTHONPATH=. python -m unittest discover -s usaw/meet_automation/tests -p 'test_*.py'

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # rsa is used only to generate ephemeral keys in JWT tests and has no
        # patched release. Production JWT verification uses jsonwebtoken's
        # rust_crypto backend and Clerk's public keys.
        run: cargo audit --ignore RUSTSEC-2023-0071
