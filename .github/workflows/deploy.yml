name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BASE: ghcr.io/meetcal/meetcal-backend/meetcal-api
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: app
        run: |
          docker build \
            -t "${IMAGE_BASE}:${DEPLOY_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .
          docker push "${IMAGE_BASE}:${DEPLOY_SHA}"
          docker push "${IMAGE_BASE}:latest"

  deploy:
    needs: build
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      DEPLOY_ROOT: /home/maddisen/dev/meetcal-llc/meetcal-backend
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/meetcal/meetcal-backend/meetcal-api:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Pull and run on prod
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          cd "${DEPLOY_ROOT}"
          git fetch origin "${DEPLOY_SHA}"
          git checkout "${DEPLOY_SHA}"
          export IMAGE="${IMAGE}"
          bash app/deploy/deploy-prod.sh
