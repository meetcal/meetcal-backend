name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BASE: ghcr.io/memohnsen/meetcal-backend/meetcal-api
      DEPLOY_ROOT: /home/maddisen/dev/meetcal-llc/meetcal-backend
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: app
        run: |
          docker build \
            -t "${IMAGE_BASE}:${DEPLOY_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .
          docker push "${IMAGE_BASE}:${DEPLOY_SHA}"
          docker push "${IMAGE_BASE}:latest"

      - name: Pull and run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE_BASE }}:${{ env.DEPLOY_SHA }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,GITHUB_ACTOR,GHCR_PULL_TOKEN
          script: |
            set -euo pipefail
            echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            cd "${{ env.DEPLOY_ROOT }}"
            git fetch origin "${{ env.DEPLOY_SHA }}"
            git checkout "${{ env.DEPLOY_SHA }}"
            export IMAGE="${IMAGE}"
            bash app/deploy/deploy-prod.sh
